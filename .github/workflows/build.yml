name: build-a72q

on:
  push:
    branches: [rise-14-ksu]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 240
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: recursive

      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison flex libssl-dev device-tree-compiler libelf-dev

      - name: Toolchains
        run: |
          T="$(dirname "$GITHUB_WORKSPACE")/../toolchains"
          mkdir -p "$T/clang/clang-r383902" "$T/gcc"
          curl -fL -o /tmp/clang.tar.gz "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/android-11.0.0_r48/clang-r383902.tar.gz"
          tar -xzf /tmp/clang.tar.gz -C "$T/clang/clang-r383902"
          git clone --depth 1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9 "$T/gcc/aarch64"
          git clone --depth 1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9 "$T/gcc/arm"
          ls "$T/clang/clang-r383902/bin/clang" "$T/gcc/aarch64/bin/aarch64-linux-android-gcc" "$T/gcc/arm/bin/arm-linux-androideabi-gcc"

      - name: Build
        run: |
          chmod +x build_a72q.sh
          sed -i 's/-j16/-j"$(nproc)"/' build_a72q.sh
          ./build_a72q.sh

      - name: Package
        run: |
          ls -l out/arch/arm64/boot/ || true
          mkdir -p artifact
          cp out/arch/arm64/boot/Image* artifact/ 2>/dev/null || true
          find out/arch/arm64/boot/dts -name '*.dtb' -exec cp {} artifact/ \; 2>/dev/null || true
          ls -l artifact/

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: kernel-${{ github.sha }}
          path: artifact/
