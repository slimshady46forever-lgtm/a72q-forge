name: build-a72q

on:
  push:
    branches: [rise-14-ksu, stealth-kernel]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 240
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: recursive

      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison flex libssl-dev device-tree-compiler libelf-dev

      - name: Toolchains
        run: |
          T="$(dirname "$GITHUB_WORKSPACE")/../toolchains"
          echo "TOOLCHAINS=$T" >> "$GITHUB_ENV"
          mkdir -p "$T/clang/clang-r383902" "$T/gcc"
          curl -fL -o /tmp/clang.tar.gz "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/android-11.0.0_r48/clang-r383902.tar.gz"
          tar -xzf /tmp/clang.tar.gz -C "$T/clang/clang-r383902"
          git clone --depth 1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9 "$T/gcc/aarch64"
          git clone --depth 1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9 "$T/gcc/arm"
          ls "$T/clang/clang-r383902/bin/clang" "$T/gcc/aarch64/bin/aarch64-linux-android-ld" "$T/gcc/arm/bin/arm-linux-androideabi-gcc"

      - name: Patch KernelSU for 4.14
        run: |
          git -C KernelSU fetch --unshallow --tags 2>/dev/null || true
          python3 - <<'PY'
          import os
          p = 'KernelSU/kernel/ksu.c'
          if os.path.exists(p):
              s = open(p).read()
              if '#include <linux/version.h>' not in s:
                  s = s.replace('#include <linux/module.h>',
                                '#include <linux/module.h>\n#include <linux/version.h>', 1)
              out = []
              for line in s.splitlines():
                  if line.startswith('MODULE_IMPORT_NS'):
                      out.append('#if LINUX_VERSION_CODE >= KERNEL_VERSION(5, 4, 0)')
                      out.append(line)
                      out.append('#endif')
                  else:
                      out.append(line)
              open(p, 'w').write('\n'.join(out) + '\n')
          p = 'KernelSU/kernel/pkg_observer.c'
          if os.path.exists(p):
              open(p, 'w').write('#include <linux/module.h>\n'
                                 'int ksu_observer_init(void) { return 0; }\n'
                                 'void ksu_observer_exit(void) {}\n')
          p = 'KernelSU/kernel/core_hook.c'
          if os.path.exists(p):
              s = open(p).read()
              if '#include <linux/version.h>' not in s:
                  s = '#include <linux/version.h>\n' + s
              s = s.replace('atomic_set(&current->seccomp.filter_count, 0);',
                            '#if LINUX_VERSION_CODE >= KERNEL_VERSION(4, 17, 0)\n    atomic_set(&current->seccomp.filter_count, 0);\n#endif')
              s = s.replace('task_work_add(current, &tw->cb, TWA_RESUME)',
                            'task_work_add(current, &tw->cb, true)')
              open(p, 'w').write(s)
          PY

          echo "ccflags-y += -DKSU_COMPAT_HAS_CURRENT_SID" >> KernelSU/kernel/Makefile
      - name: Build
        env:
          KBUILD_BUILD_USER: android
          KBUILD_BUILD_HOST: localhost
        run: |
          chmod +x build_a72q.sh
          sed -i "s|\.\./\.\./toolchains|$TOOLCHAINS|g" build_a72q.sh
          sed -i 's/-j16/-j"$(nproc)"/' build_a72q.sh
          ./build_a72q.sh

      - name: Package
        run: |
          ls -l out/arch/arm64/boot/ || true
          mkdir -p artifact
          cp out/arch/arm64/boot/Image* artifact/ 2>/dev/null || true
          find out/arch/arm64/boot/dts -name '*.dtb' -exec cp {} artifact/ \; 2>/dev/null || true
          ls -l artifact/

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: kernel-${{ github.sha }}
          path: artifact/
